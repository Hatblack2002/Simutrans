name: Android ARM64 baseline

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build components
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Fetch upstream Android project and engine
        shell: bash
        run: |
          set -euxo pipefail
          git clone --recurse-submodules https://github.com/simutrans/simutrans-android-project.git android-project
          test -d android-project/simutrans/jni
          test ! -e android-project/simutrans/jni/simutrans
          git clone --depth 1 https://github.com/simutrans/simutrans.git android-project/simutrans/jni/simutrans
          git -C android-project/simutrans/jni/SDL status --short
          git -C android-project/simutrans/jni/simutrans rev-parse --short HEAD

      - name: Prepare SDL2 and FluidSynth
        shell: bash
        working-directory: android-project/simutrans/jni
        run: |
          set -euxo pipefail
          # Apply the known SDL compatibility revert only when the commit exists in this checkout.
          if git -C SDL cat-file -e '53dbe18^{commit}' 2>/dev/null; then
            git -C SDL revert --no-edit --no-commit 53dbe18
          else
            echo "SDL compatibility commit 53dbe18 is not in the checked-out history; continuing without revert."
          fi
          curl --fail --show-error --location --retry 4 --retry-delay 2 \
            https://github.com/FluidSynth/fluidsynth/releases/download/v2.6.0/fluidsynth-v2.6.0-android24.zip \
            --output /tmp/fluidsynth-android24.zip
          unzip -t /tmp/fluidsynth-android24.zip
          mkdir -p fluidsynth
          unzip -q -o /tmp/fluidsynth-android24.zip -d fluidsynth
          find fluidsynth -maxdepth 4 -type f -print | sed -n '1,80p'

      - name: Build native dependencies for ARM64 only
        shell: bash
        working-directory: android-project/simutrans/jni
        run: |
          set -euxo pipefail
          export ANDROID_NDK="$ANDROID_NDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          test -x "$ANDROID_NDK_ROOT/ndk-build"
          # The upstream script builds four ABIs; CI's first milestone only needs arm64-v8a.
          sed -i '/build_for_android armeabi-v7a /s/^/# ARM64-only CI: /' build_libraries.sh
          sed -i '/build_for_android x86 /s/^/# ARM64-only CI: /' build_libraries.sh
          sed -i '/build_for_android x86_64 /s/^/# ARM64-only CI: /' build_libraries.sh
          grep -n 'build_for_android' build_libraries.sh
          bash ./build_libraries.sh

      - name: Prepare game assets
        shell: bash
        working-directory: android-project/simutrans/jni
        run: |
          set -euxo pipefail
          bash ./simutrans/src/android/AndroidPreBuild.sh
          mkdir -p ../src/main/assets
          cp -rf simutrans/simutrans/. ../src/main/assets/
          cp -r SDL/android-project/app/src/main/java ../src/main/
          test -f ../src/main/AndroidManifest.xml
          test -d ../src/main/assets
          find ../src/main/assets -maxdepth 2 -type f -print | sed -n '1,80p'

      - name: Configure ARM64-only Gradle build
        shell: bash
        working-directory: android-project
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("simutrans/build.gradle")
          s = p.read_text()
          old = "abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'"
          if old in s:
              s = s.replace(old, "abiFilters 'arm64-v8a'")
          elif "abiFilters" in s:
              import re
              s, n = re.subn(r"abiFilters\s+[^\n]+", "abiFilters 'arm64-v8a'", s, count=1)
              if not n:
                  raise SystemExit("Could not rewrite abiFilters in simutrans/build.gradle")
          else:
              raise SystemExit("No abiFilters declaration found in simutrans/build.gradle")
          p.write_text(s)
          print("\n".join(line for line in s.splitlines() if "abiFilters" in line))
          PY
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find android-project -path '*/build/outputs/apk/debug/*.apk' -type f -print -quit)"
          test -n "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | sed -n '1,40p'

      - name: Upload APK and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simutrans-android-arm64-debug
          path: |
            android-project/**/build/outputs/apk/debug/*.apk
            android-project/**/build/reports/**
            android-project/**/build/outputs/**/*.txt
          if-no-files-found: warn
          retention-days: 14
